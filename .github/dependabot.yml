version: 2
updates:
  # One pull request a month for minor and patch updates, so that the macOS runners are not
  # flooded; major updates still come one by one.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      swift-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
