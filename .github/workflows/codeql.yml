name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    # A Swift analysis takes well under an hour: a stuck one must not hold a macOS runner for six hours.
    timeout-minutes: 60
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - run: swift build -c release
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
          upload: never
          output: sarif-results
      # Report only this package's code: dependencies checked out under .build are analysed
      # because they are compiled, but their findings belong to their own projects.
      - name: Drop findings in dependencies
        run: |
          for f in sarif-results/*.sarif; do
            jq '.runs |= map(.results |= map(select(all(.locations[]?; (.physicalLocation.artifactLocation.uri // "") | startswith(".build/") | not))))' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results
          category: "/language:swift"
