# git-cliff configuration (https://git-cliff.org).
# Regenerate the changelog with:  git cliff -o CHANGELOG.md
# Conventional Commits are grouped by type; older summaries, imperative English
# sentences, by their leading verb.

[changelog]
header = """
# Changelog

All notable changes to DcmSwift are listed here, newest first. This file is
generated from the commit history with [git-cliff](https://git-cliff.org); do
not edit it by hand.\
"""
body = """

{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}
"""
# A footer, since git-cliff ends the changelog with a blank line otherwise.
footer = """

<!-- generated by git-cliff -->"""
trim = false
# Postprocessors apply to each release, not to the whole file: every release
# ends with one newline and starts with a blank line (see the body), so
# sections are separated by exactly one blank line.
postprocessors = [
  { pattern = "\n{3,}", replace = "\n\n" },
  { pattern = "\n+$", replace = "\n" },
]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"
commit_parsers = [
  { message = "^Merge", skip = true },
  { message = "^WIP", skip = true },
  # Notes of the internal workflow (agent handoffs, pipeline records) are not
  # changes of the library.
  { message = "(?i)^[^\\n]*(handoff|\\bagents?\\b|claude|codex|delivery pipeline)", skip = true },
  { message = "^(chore|ci|build)(\\(.*\\))?!?:", skip = true },
  { message = "^feat(\\(.*\\))?!?:", group = "<!-- 0 -->Added" },
  { message = "^fix(\\(.*\\))?!?:", group = "<!-- 1 -->Fixed" },
  { message = "^perf(\\(.*\\))?!?:", group = "<!-- 2 -->Changed" },
  { message = "^refactor(\\(.*\\))?!?:", group = "<!-- 2 -->Changed" },
  { message = "^docs(\\(.*\\))?!?:", group = "<!-- 4 -->Documentation" },
  { message = "^test(\\(.*\\))?!?:", group = "<!-- 5 -->Tests" },
  { message = "(?i)^(Add|Added|Implement|Support|Decode|Encode|Publish|Start|Init|Model)\\b", group = "<!-- 0 -->Added" },
  { message = "(?i)^(Fix|Fixed|Correct)\\b", group = "<!-- 1 -->Fixed" },
  { message = "(?i)^(Remove|Removed|Delete|Drop)\\b", group = "<!-- 3 -->Removed" },
  { message = "(?i)^(Document|Comment|Comments|Documentation|Doc|Docs)\\b", group = "<!-- 4 -->Documentation" },
  { message = "(?i)^(Test|Tests|Fuzz)\\b", group = "<!-- 5 -->Tests" },
  { message = ".*", group = "<!-- 2 -->Changed" },
]
# Conventional summaries are printed without their type prefix (git-cliff keeps
# only the description); "[skip ci]" markers are dropped.
commit_preprocessors = [
  { pattern = " *\\[skip ci\\]", replace = "" },
]
